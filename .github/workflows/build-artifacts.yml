---
name: Build Artifacts (Self-Hosted)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, dev, ubuntu22, skylake]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Required Local Dependencies (pre-installed on the runner):
      # - System: texlive-latex-recommended, texlive-pictures,
      #           texlive-latex-extra, texlive-xetex, lmodern,
      #           texlive-fonts-recommended, graphviz, pandoc,
      #           libimage-exiftool-perl, qpdf, xournalpp
      # - Python: matplotlib, pandas, scipy

      - name: Generate Assets (Conditional/Optional)
        run: |
          make render
          python3 scripts/gen_complexity_curves.py

      - name: Build Paper and Documentation
        run: |
          make paper
          make docs

      - name: Unarchive Xournalpp handwritten notes
        run: |
          cd paper/journal-pads
          make unarchive loc=out/xml/handwritten-defense-2026-05-01-Note-22-41.xml
          make archive

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-pdfs
          path: |
            paper/paper.pdf
            paper/journal-pads/out/pdf/*.pdf
            README.pdf
            docs/*.pdf
