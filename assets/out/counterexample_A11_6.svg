<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="white"/>
  <g fill="black" font-family="DejaVu Sans, Arial, sans-serif">
    <text x="60" y="58" font-size="30" font-weight="bold">Counterexample 2: A(11,6), R = 31</text>
    <text x="60" y="92" font-size="18">The embedding-gated RestrictedLowerBound is false</text>

    <rect x="55" y="120" width="1090" height="125" fill="none" stroke="black" stroke-width="2"/>
    <text x="78" y="153" font-size="20" font-weight="bold">Parameters</text>
    <text x="78" y="184" font-size="18">n = 11,  k = 6,  m = n − k = 5,  R = 1 + 6m = 31</text>
    <text x="78" y="215" font-size="18">d = ⌈log₂R⌉ = ⌈log₂31⌉ = 5; gate requires d≤k and d≤n−k: 5≤6 and 5≤5</text>
    <text x="78" y="238" font-size="15">Thus the Hamming-ball embedding exists, but it is not boundary-minimizing.</text>

    <text x="72" y="287" font-size="21" font-weight="bold">Full Star S₆</text>
    <rect x="55" y="265" width="560" height="490" rx="8" fill="none" stroke="#7a2020" stroke-width="2" stroke-dasharray="2 7"/>
    <text x="430" y="280" font-size="13" fill="#7a2020">A(11,6) graph schematic</text>
    <text x="72" y="316" font-size="16">center: (0,1,2,3,4,5)</text>
    <text x="72" y="341" font-size="15">For i∈{0,…,5}: Bᵢ={c}∪{c[i←s] : s∈{6,7,8,9,10}}</text>
    <text x="72" y="358" font-size="14">Each Bᵢ≅K₆, and S₆=⋃ᵢ Bᵢ (all six branches share c).</text>
    <g stroke="black" stroke-width="2" fill="white">
      <line x1="270" y1="450" x2="270" y2="385"/><line x1="270" y1="450" x2="365" y2="425"/><line x1="270" y1="450" x2="365" y2="515"/>
      <line x1="270" y1="450" x2="270" y2="555"/><line x1="270" y1="450" x2="175" y2="515"/><line x1="270" y1="450" x2="175" y2="425"/>
      <rect x="225" y="365" width="90" height="38" rx="19"/><rect x="320" y="405" width="90" height="38" rx="19"/>
      <rect x="320" y="495" width="90" height="38" rx="19"/><rect x="225" y="535" width="90" height="38" rx="19"/>
      <rect x="130" y="495" width="90" height="38" rx="19"/><rect x="130" y="405" width="90" height="38" rx="19"/>
      <circle cx="270" cy="450" r="30" fill="black"/>
    </g>
    <text x="270" y="450" text-anchor="middle" dominant-baseline="middle" font-size="18" fill="white">c</text>
    <text x="253" y="390" font-size="13">i=0: K₆</text><text x="348" y="430" font-size="13">i=1: K₆</text>
    <text x="348" y="520" font-size="13">i=2: K₆</text><text x="253" y="560" font-size="13">i=3: K₆</text>
    <text x="158" y="520" font-size="13">i=4: K₆</text><text x="158" y="430" font-size="13">i=5: K₆</text>
    <rect x="425" y="400" width="180" height="150" rx="6" fill="none" stroke="#777" stroke-width="1.5"/>
    <text x="435" y="418" font-size="12" font-weight="bold">Expanded branch B₀</text>
    <g stroke="#555" stroke-width="1.2" fill="white">
      <line x1="455" y1="480" x2="520" y2="435"/><line x1="455" y1="480" x2="520" y2="458"/><line x1="455" y1="480" x2="520" y2="481"/><line x1="455" y1="480" x2="520" y2="504"/><line x1="455" y1="480" x2="520" y2="527"/>
      <line x1="520" y1="435" x2="520" y2="458"/><line x1="520" y1="435" x2="520" y2="481"/><line x1="520" y1="435" x2="520" y2="504"/><line x1="520" y1="435" x2="520" y2="527"/>
      <line x1="520" y1="458" x2="520" y2="481"/><line x1="520" y1="458" x2="520" y2="504"/><line x1="520" y1="458" x2="520" y2="527"/>
      <line x1="520" y1="481" x2="520" y2="504"/><line x1="520" y1="481" x2="520" y2="527"/><line x1="520" y1="504" x2="520" y2="527"/>
      <circle cx="455" cy="480" r="14" fill="black"/>
      <circle cx="520" cy="435" r="7"/><circle cx="520" cy="458" r="7"/><circle cx="520" cy="481" r="7"/><circle cx="520" cy="504" r="7"/><circle cx="520" cy="527" r="7"/>
    </g>
    <text x="450" y="484" font-size="10" fill="white">c</text>
    <text x="532" y="438" font-size="10">6</text><text x="532" y="461" font-size="10">7</text><text x="532" y="484" font-size="10">8</text><text x="532" y="507" font-size="10">9</text><text x="532" y="530" font-size="10">10</text>
    <text x="435" y="544" font-size="10">c[0←6,7,8,9,10]</text>
    <text x="430" y="570" font-size="12">For i≠i′ and s≠s′, leaves share</text>
    <text x="430" y="586" font-size="12">k−2=4 coordinates → X.</text>
    <text x="74" y="610" font-size="18">D = jm = 30  (root/fiber defect)</text>
    <text x="74" y="640" font-size="18">X = m(m−1) C(j,2) = 5·4·15 = 300  (external excess)</text>
    <text x="74" y="670" font-size="18">Q = X + (m+1)D = 300 + 6·30 = 480</text>
    <text x="74" y="700" font-size="14">Cross-branch check: leaves (i←s) and (i′←s′), i≠i′, s≠s′,</text>
    <text x="74" y="721" font-size="14">share k−2 = 4 fixed coordinates; the resulting common</text>
    <text x="74" y="742" font-size="14">external neighbors contribute to X (not to internal edge count).</text>

    <rect x="650" y="275" width="450" height="480" fill="none" stroke="black" stroke-width="2"/>
    <text x="680" y="322" font-size="21" font-weight="bold">Boundary comparison</text>
    <line x1="680" y1="340" x2="1070" y2="340" stroke="black"/>
    <text x="680" y="378" font-size="18">degree · R = kmR = 6·5·31 = 930</text>
    <text x="680" y="420" font-size="19" font-weight="bold">Hamming ball: 930 − G = 476</text>
    <text x="680" y="462" font-size="19" font-weight="bold">Full Star:     930 − Q = 450</text>
    <line x1="680" y1="485" x2="1070" y2="485" stroke="black"/>
    <text x="680" y="528" font-size="24" font-weight="bold">450 &lt; 476</text>
    <text x="680" y="560" font-size="18">Star wins by 26 boundary vertices.</text>
    <text x="680" y="592" font-size="16">G = C(31) + 5E(31) = 79 + 375 = 454</text>
    <line x1="680" y1="610" x2="1070" y2="610" stroke="black"/>
    <text x="680" y="636" font-size="14" font-weight="bold">Metric key</text>
    <text x="680" y="658" font-size="13">j = 6 active coordinate branches; m = n−k</text>
    <text x="680" y="679" font-size="13">D = Rk − U: root/fiber defect; X = external multiplicity excess</text>
    <text x="680" y="700" font-size="13">Q = kmR − |∂S| = 2|E(S)| + X;  G = C(R) + mE(R)</text>
    <text x="680" y="721" font-size="13">E(R)=Σ_{0≤i&lt;R} popcount(i)</text>
    <text x="680" y="742" font-size="13">C(R)=(R−1)+Σ_{1≤i&lt;R} bit_length(i)−E(R)</text>
  </g>
</svg>
